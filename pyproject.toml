[project]
name = "jev-harness"
version = "0.1.0"
description = "Multi-persona agent harness where a System One model (Jev) gates what each worker sees."
requires-python = ">=3.11"
dependencies = ["pyyaml", "rich"]

[project.optional-dependencies]
claude = ["anthropic"]
web = ["fastapi", "uvicorn"]
browser = ["playwright"]   # then: python -m playwright install chromium
desktop = ["comtypes; sys_platform == 'win32'", "pillow"]   # the desktop tool (Windows UI Automation)
dev = ["pytest", "httpx"]

[project.scripts]
jevh = "jevh.cli:main"

[tool.setuptools]
packages = ["jevh", "jevh.repl", "jevh.tools", "jevh.web", "jevh.refine"]

[tool.setuptools.package-data]
"jevh.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
