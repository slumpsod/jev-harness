[project]
name = "jev-harness"
version = "0.1.0"
description = "Multi-persona agent harness where a System One model (Jev) gates what each worker sees."
requires-python = ">=3.11"
dependencies = ["pyyaml", "rich"]

[project.optional-dependencies]
claude = ["anthropic"]
web = ["fastapi", "uvicorn", "websockets", "pymupdf", "pillow"]   # (websockets: devices connect to the dashboard; pymupdf, pillow: look_at() shows a PDF's pages or a photo to the model)
browser = ["playwright"]   # then: python -m playwright install chromium
desktop = ["comtypes; sys_platform == 'win32'", "pillow"]   # the desktop tool (Windows UI Automation)
device = ["websockets", "pillow"]   # let a hub's assistant use this computer: jevh device (docs/devices.md)
app = ["fastapi", "uvicorn", "websockets", "pymupdf", "pywebview", "pystray", "pillow", "numpy"]   # jevh app: the window, tray icon and orb
dev = ["pytest", "httpx", "numpy", "pillow"]   # (numpy, pillow: the orb's pictures, tests/test_orb.py)

[project.scripts]
jevh = "jevh.cli:main"

[tool.setuptools]
packages = ["jevh", "jevh.repl", "jevh.tools", "jevh.web", "jevh.refine", "jevh.devices"]

[tool.setuptools.package-data]
"jevh.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
