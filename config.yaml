# Jev harness configuration. Paths are relative to this file.

jev:
  url: http://127.0.0.1:33001     # openjev/systemone.py adapter
  backend: semif                  # semif (4B, ~10GB on the 4080) | laya (1.7GB) | openjev
  timeout: 300
  backend_health: http://127.0.0.1:33003/health   # semif bridge; shown in the dashboard's Status tab

thresholds:
  route: 0.45          # persona choice confidence needed to switch persona
  stick: 0.55          # "continues the conversation" noul needed to stay with the current persona
  follow_topic: 0.25   # follow-up if "continues the topic" >= this ... (14/14 follow-ups, 0/8 new topics
  follow_reply: 0.40   # ... or "reply to the assistant's last message" >= this   on followup_cases.py)
  skill_none_veto: 0.90  # P("none of these") in the skill Choice at/above which no skill loads
  skill_override: 0.90   # Choice leader this sure loads without the fits check
  skill_fits: 0.08       # else: best Choice*fits leader needs fits >= this (fits noul runs low; 0.08 > 0.10 on 63 cases)
  memory: 0.20         # "depends on this snippet" noul on the Choice leaders (0.15-0.20 plateau; 0.10 leaks)
  collab: 0.60         # per-persona "needs this expertise" noul
  approve: 0.50        # in_scope and necessary nouls for persona->persona requests
  tier_strong: 0.55    # P(strong) in Jev's fast/strong Choice at/above which a task keeps the persona's own model
  tool: 0.65           # "need this tool" noul per REPL tool guide (40/42, 0 needless at 0.6-0.7 on tool_cases.py)
  mcp_fits: 0.50       # "needs this tool" noul on the MCP Choice leaders
  fact: 0.88           # learning: "the user states a lasting fact" noul (12/12, 0 false at 0.85-0.9; learn_cases.py)
  same_fact: 0.50      # learning: "old fact made redundant or outdated by the new one" (5/5, 0 false)
  verify_claims: 0.80  # final() gate: "claims things the work log doesn't show" noul (evals/verify_cases.py:
  verify_delivers: 0.80  # 12/12 bad answers caught, 0/10 false alarms with the plain rules), "delivers what
  verify_honest: 0.80  # was asked", "says plainly what is not done"
  verify_accurate: 0.40  # final() gate: "accurate report of the work log" noul (flags only if also not honest)
  stall: 0.60          # progress check: "repeating the same attempt" noul (6/6 stalls, 0/8 healthy runs; progress_cases.py)
  testable: 0.55       # thinking watch: "doing by hand what code does exactly on the data" (11/11, 0/8 wrong; thinking_watch_cases.py)
  searching: 0.25      # ...or "stuck trying idea after idea" minus "checking one idea" above this (searching let through: 10/10 paused; search_cases.py)
  compact_keep: 0.80   # compaction: "step holds information finishing the task uses again" -> kept in full (16/18, 3/22; compact_cases.py)
  rule_block: 0.80     # rule enforcer: "change breaks rule" blocks the edit (14/18 blocked, 0/30 good edits; rule_cases.py)
  review_risk: 0.65    # cheap first pass: a changed file this risky gets a full review by the strong model (18/19, 0/18; risk_cases.py)
  review_severe: 0.20  # ...reviewed by the strong model if a mistake could be severe (15/15, 13/13 with plain code; severity_cases.py)
  learn_skill: 0.50   # learning: "non-obvious steps, fixes or settings" noul before a skill is written (3/3, 0 false)
  failure_gave_up: 0.85  # failure log's Jev check: "the answer says it couldn't (fully) do it" (not tuned yet:
  failure_missed: 0.85   # evals/failure_cases.py) ... "the answer doesn't deliver what was asked"

limits:
  max_skills: 1                 # evals: every extra skill was mostly noise
  max_memory_chunks: 4          # after gating
  memory_candidates_own: 20     # recent turns from the persona's own log
  memory_candidates_shared: 6   # recent turns from other personas (Jev decides if they leak in)
  memory_search: 10             # + turns from ANY time that share words with the request (full-text index)
  memory_facts: 6               # + remembered facts that share words with the request
  follow_turns: 2               # a follow-up carries this session's last N turns as real conversation
  ask_timeout: 1800             # seconds a worker's ask_user() waits for the user before carrying on
  progress_every: 8             # every N steps Jev checks a long task isn't going in circles
  compact_tokens: 60000         # past this estimated size, older steps condense to a progress log
                                # (Qwen has 100k of context loaded in LM Studio)
  keep_steps: 3                 # recent steps kept verbatim when compacting
  keep_reasoning: 40000         # chars of each step's hidden reasoning sent back to the model (reasoning_content); 0 = none
  thinking_watch: 0             # 1: Jev reads long thinks as they stream; a checkable idea pauses the step to test it in code
  watch_every: 4000             #   ...checked every this many new chars of thinking,
  watch_after: 6000             #   ...once a step has thought this much
  max_depth: 3                  # nested persona requests
  max_tasks_per_turn: 8
  repl_timeout: 1800            # seconds per code block (callbacks excluded); Stop ends it sooner
                                # (long commands: start_job() in the background)
  output_cap: 4000              # chars of REPL output shown to the model per step
  max_mcp_tools: 3              # MCP tool descriptions per task, after Jev's pick

learning: true                  # remember facts and learn skills after successful turns (jevh/learn.py)

# The final() gate (jevh/verify.py): the harness checks work before accepting it.
verify:
  enabled: true
  max_bounces: 2           # times a worker is sent back to fix problems; after that, accepted with a warning
  render_html: true        # open HTML artifacts in a headless browser (script errors, blank page)
  check_answer: true       # Jev: does the answer hold up against the work log?
  review: true             # risky project changes (Jev's first pass) get a full review by the strong model
  review_tier: auto        # the reviewer: auto (Jev: strong if a mistake could be severe - access, secrets,
                           # data loss, money - else fast) | strong | fast. Live: Qwen ~5 min, fast ~7 s
  # project_command: python -m pytest -q   # tests to run when a worker changed project files (default: detected)

# Failure log (jevh/failures.py): what went wrong in each task, kept in workspace/failures.db to improve
# the harness from. The harness's own signals (crash, step limit, stall, final() gate, ...) are always
# logged; a worker can log one with report_failure(); `python -m jevh.failures` lists and exports them.
failures:
  enabled: true
  jev_check: true          # after each task, Jev judges the answer: gave up / doesn't deliver what was asked
  hooks: []                # your own checks, run on harness events (see jevh/failures.py), e.g.
  #  - name: no_sources
  #    on: [done]                           # event kinds; "*" = every event
  #    command: python checks/sources.py    # event JSON on stdin; print a summary (or exit 2) to flag a failure
  #  - on: [output]
  #    python: checks.repl:bad_output       # fn(event) -> None | str | {kind, summary, detail} | list

# Session review (jevh/review.py): flag a session (dashboard "Flag for review", CLI /flag) and write notes on
# what went wrong; a model then reads the session against the notes, lists the problems and says whether it
# was a failure. A failure verdict also goes into the failure log (source "review").
review:
  model: null              # "provider:model" that reviews (default: models.strong, else the default persona's)
  max_tokens: 32768        # per review reply, thinking included
  prompt_chars: 60000      # the session is cut to about this size (work logs keep their ends)

# Refinement (jevh/refine/): logged failures -> tests -> a fix by a local model -> old vs new on every
# local model -> a report you approve or reject. `python -m jevh.refine nightly` runs it; see README.
refine:
  model: null              # "provider:model" that writes tests and fixes (local only; default models.strong,
                           # else the fixer persona's model)
  models: null             # models the tests run on (default: every local model in this config)
  discover: false          # also every chat model LM Studio lists
  max_tokens: 65536        # per test-writing reply, thinking included (Qwen 3.8 27B used 18-21k; 32k cut lists off)
  cases: 10                # test variants written per failure (plus the failure itself)
  runs: 2                  # runs of each case per model and version
  repro_runs: 4            # replays of the failed request per model before any variant is written
  min_repro: 0.1           # share of those replays that must fail (a 1-in-4 failure is worth fixing)
  repro_target: 3          # the replay then runs often enough to expect 3 failures on the old code...
  max_runs: 8              # ...up to 8 per model and version
  fix_tries: 2             # changes the fixer may try per failure
  min_gain: 0.15           # the failing cases' pass rate must rise this much to be proposed as "improves"
  min_cost_gain: 0.5       # cost kinds: gate bounces per run on the failing cases must halve
  cost_kinds: [gate_bounce]   # the task got done with needless extra work: scored on bounces, not completion
  case_timeout: 3600       # seconds per test run
  fixer_persona: high_end_dev

# Cost per million tokens for paid models (usage tracking); local models cost nothing.
prices: {}
#  claude-opus-5: {input: 5.0, output: 25.0}
default_persona: daily_assistant
personas_dir: personas
skills_dirs:                    # first root wins on name clashes; hidden dirs (.archive) skipped
  - skills                      # add more roots in config.local.yaml, e.g. a Hermes skills folder
workspace: workspace

# Jev sends easy tasks here (per task, incl. hand-offs); hard ones keep the persona's own model.
# Remove this block to disable tiering. Personas can opt out with `fast_ok: false`.
models:
  fast: {provider: lmstudio, model: ornith-1.5-35b-a3b}

# Model providers. type: openai = any OpenAI-compatible server; anthropic = Claude API (SDK).
providers:
  lmstudio:
    type: openai
    base_url: http://127.0.0.1:1234/v1
    exclusive: true    # keep ONE LLM loaded: unload the current model before loading another
    swap_linger: 8     # seconds a model stays after its last request, so a worker's next step keeps it
    native_tools: true # workers act through a real `python` tool (the model's own tool-call format)
  llamacpp:
    type: openai
    base_url: http://127.0.0.1:8080/v1
  vllm:
    type: openai
    base_url: http://127.0.0.1:8000/v1
  openai:
    type: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
  anthropic:
    type: anthropic
    # credentials: ANTHROPIC_API_KEY or an `ant auth login` profile
    fallbacks: default           # server-side refusal fallbacks (Opus 5 / Fable 5.1)

tools:
  comfy_url: http://127.0.0.1:8188
  comfy_workflows: C:/Comfyui workflows
  tools_jev: local            # browser/web/project decisions: local (the adapter above) | cloud (TYPESAFE_API_KEY)
  browser_watch: false        # true: the browser tool opens a visible window with Jev's picks outlined
  # nango: the user's connected accounts (Gmail, GitHub, Slack...). Needs NANGO_SECRET_KEY; see SETUP.md.
  # nango_url: https://api.nango.dev   # (default) Nango Cloud; on this machine (nango/docker-compose.yaml): http://localhost:3003
  nango_writes: ask           # changes (send, create, edit, delete): ask the user | deny | allow

# MCP servers (stdio). Started on first use; Jev picks which of their tools a task sees.
# Personas opt in with `mcp: ["server.*"]`.
mcp_servers: {}
