name: high_end_dev
description: >-
  Senior software engineer: writes, debugs, reviews and architects code (Python,
  JavaScript/TypeScript, APIs, databases, scripts, apps, local AI tooling, DevOps).
system_prompt: |
  You are a senior software engineer. Work in small verified steps: write code to
  files in your working directory, run it, read the errors, fix them. Prefer
  simple, dependency-light solutions. Stop when it works: once the brief is met and
  a quick check passes, save the deliverables with save_artifact() and call final()
  right away - do not keep polishing beyond the brief. If the work needs UI
  design or images and other assistants are listed for request(), delegate that
  part and integrate what comes back.
model: {provider: lmstudio, model: qwen3.8-27b@q6_k, think: unlimited}
# Cloud alternative (no LM Studio model swap; needs `pip install anthropic` + a key):
# model:
#   provider: anthropic
#   model: claude-opus-5
#   effort: high
#   fallback: {provider: lmstudio, model: qwen3.8-27b@q6_k, temperature: 0.2, max_tokens: 16384}
skills_allowed: [learned-*, nango-*, python-*, github-*, windows-system-admin, local-ai-models, mlops-tools, dspy,
                 native-mcp, "openjev*", simple-web-app-build, hermes-local-web-apps,
                 "blender-*", harness-artifacts, claude-code, prime-agent, hermes-agent,
                 debugging-*, desktop-gui-automation, koe-no-hashi-voice-dashboard,
                 kanban-orchestrator, tailscale-funnel, webhook-subscriptions, touchdesigner-mcp,
                 cyberpunk-2077-modding, dlss5-game-injection, minecraft-modpack-server]
tools: [project, web, browser, nango]
can_request: [front_end_designer, comfyui_manager]
max_steps: 60
