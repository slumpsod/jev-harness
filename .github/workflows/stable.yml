# Runs the tests on every push to main and, when they pass, moves the `stable` branch to that commit.
# `jevh update` follows stable by default (jevh/update.py), so a commit that breaks the tests never
# reaches anyone who hasn't chosen the main channel.
#
# Linux / Python 3.11 is required for a commit to become stable. The other legs report but don't
# block (see `continue-on-error`); make one required by adding it to the `required` list below.
# There is no macOS leg: it timed out at 20 minutes on every run, and GitHub bills macOS minutes at 10x; it
# most likely used up the account's Actions minutes: `promote` then got no runner (2026-10-13).
name: Tests, then stable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # to push the stable branch

concurrency:
  group: stable     # one at a time; an older run never moves stable backwards (see promote)
  cancel-in-progress: false

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", required: true}
          - {os: ubuntu-latest, python: "3.13", required: false}
          - {os: windows-latest, python: "3.11", required: false}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[web,dev]"
      - name: Tests
        run: python -m pytest -q
        timeout-minutes: 20

  promote:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move stable to this commit
        run: |
          if git rev-parse --verify -q origin/stable >/dev/null; then
            if ! git merge-base --is-ancestor origin/stable "$GITHUB_SHA"; then
              echo "stable is already at a newer commit (or main was rewritten): leaving it where it is"
              exit 0
            fi
          fi
          git push origin "$GITHUB_SHA:refs/heads/stable"
          echo "stable -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
